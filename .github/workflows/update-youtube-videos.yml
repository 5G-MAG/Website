name: Update YouTube Videos

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# GITHUB_TOKEN only needs to read; the commit/push step below authenticates
# with SYNC_TOKEN (a PAT), not the default token.
permissions:
  contents: read

jobs:
  update-youtube-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest videos (Workshops, Developer Exchange, Public Call, Demos and per-project playlists)
        run: node scripts/fetch-youtube-playlists.js

      - name: Commit and push if changed
        # Runs even if the fetch step above failed: the script falls back to
        # the previous value for any playlist it couldn't reach and still
        # writes a valid file, so a single dead playlist ID shouldn't block
        # the other playlists' updates from being committed. The fetch step
        # still exits non-zero on partial failure, so the run is correctly
        # flagged red in Actions -- this only stops that failure from also
        # silently discarding everything that did succeed.
        if: ${{ !cancelled() }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/youtube-playlists.json
          git diff --cached --quiet || git commit -m "Update YouTube videos"
          git push
